<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <main>
      <div class="container">
        <div class="terminal">
          <header class="terminal-header">
            <span class="prompt">todcubed@linux:~$</span> ./blog
            <nav class="site-nav" aria-label="Main navigation">
              <a href="{{ '/' | relative_url }}">posts</a>
              <a href="{{ '/about/' | relative_url }}">about</a>
              <a href="{{ '/feed.xml' | relative_url }}">rss</a>
            </nav>
          </header>
          <div id="main-content">{{ content }}</div>
          <footer class="site-footer">
            <span>© {{ site.time | date: "%Y" }} todcubed</span>
            <span class="prompt">todcubed@linux:~$ exit</span>
          </footer>
        </div>
      </div>
    </main>
  </body>
</html>
